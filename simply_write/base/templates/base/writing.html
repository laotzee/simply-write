{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ title }} - My Website</title>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'writing' %}">Writing</a>
    </nav>
    <h1>{{ message }}</h1>

    <div class="promptArea">
        <p id="outputText"></p>
        <button id="fetchButton">Get a new prompt</button>
    </div>
    <br><br>

    <form method="post">
        {% csrf_token %}
        <!-- Add your writing form fields here -->
        <textarea id='writingArea' name="content" placeholder="Start writing..." rows="10" cols="50"></textarea><br>
        <input type="submit" value="Save">
    </form>

    <script src="{% static 'js/getPrompt.js' %}"></script>

</body>
</html>
